<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S - Advanced Personal AI Assistant</title>
<link rel="stylesheet" href="style.css">
<!-- Three.js for 3D Animated Head/Face -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- HEADER -->
  <header>
    <button id="settings-btn" class="settings-icon" title="View History Log">📜</button>
    <button id="api-key-btn" class="api-key-icon" title="Set Gemini API Key">🔑</button>
    <h1>J.A.R.V.I.S</h1>
    <p>ADVANCED PERSONAL AI ASSISTANT</p>
  </header>

  <!-- 3D ANIMATED FACE & VOICE WAVEFORM SECTION -->
  <div class="core-container">
    <div id="face-container"></div>
    
    <!-- Audio Waveform Visualizer Bar under Face -->
    <div class="audio-wave-container">
      <span class="status-dot">●</span>
      <span class="status-state" id="status-text">SPEAKING</span>
      <div class="wave-bars">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
    </div>

    <!-- Custom Quote under Animated Face -->
    <p class="boss-quote">ALWAYS AT YOUR SERVICE, BOSS BHARANI</p>
  </div>

  <!-- EXPANDED CHAT CONVERSATION CONTAINER -->
  <div class="chat" id="chat"></div>

  <!-- CONTROL INPUT AREA -->
  <div class="input-area">
    <div class="input-row">
      <input id="msg" type="text" placeholder="Enter command or speak 'open my details'..." />
      <button id="execute-btn" class="btn btn-primary">EXECUTE</button>
    </div>
    <div class="input-row" style="margin-top: 6px;">
      <button id="mic-btn" class="btn" title="Voice Input" style="flex: 1;">🎙️ MIC</button>
      <button id="gallery-btn" class="btn" title="Upload Gallery Image" style="flex: 1;">🖼️ GALLERY</button>
      <button id="files-btn" class="btn" title="Open Memory Box" style="flex: 1;">📁 FILES</button>
      <button id="clear-btn" class="btn btn-danger" title="Clear Active Chat" style="flex: 1;">CLEAR</button>
    </div>
    <!-- Direct File Input for Gallery Only (No Camera Access) -->
    <input id="img-input" type="file" accept="image/*" style="display:none">
  </div>

  <!-- MODAL 1: HISTORY LOG POPUP -->
  <div id="history-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>HISTORY LOG</h2>
        <span id="close-history" class="close-btn">&times;</span>
      </div>
      <div id="history-list" class="history-container"></div>
      <button id="clear-all-history" class="btn btn-danger" style="width: 100%; margin-top: 10px;">CLEAR ALL HISTORY</button>
    </div>
  </div>

  <!-- MODAL 2: MEMORY & FILES BOX (NEON BLUE FLAME) -->
  <div id="memory-modal" class="modal">
    <div class="modal-content neon-flame-box">
      <div class="modal-header">
        <h2>MY FILES & DETAILS</h2>
        <span id="close-memory-modal" class="close-btn">&times;</span>
      </div>
      <div class="memory-body">
        <input type="text" id="memory-search-input" placeholder="Search or type new memory details here, Boss..." />
        <textarea id="custom-memory-input" placeholder="Add detailed notes, family details, or facts here..."></textarea>
        <button id="save-custom-memory" class="neon-btn">SAVE TO MEMORY</button>
        <div id="saved-memory-list" class="history-container" style="margin-top: 12px;"></div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
